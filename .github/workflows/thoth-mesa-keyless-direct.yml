name: THOTH Mesa Anonymous Routed Dialogue

on:
  push:
    branches:
      - lab/thoth-mesa-keyless-direct

permissions:
  contents: write

jobs:
  dialogue:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/thoth-mesa-keyless-direct

      - name: Run real routed model-to-model dialogue
        shell: bash
        run: |
          mkdir -p lab/thoth-mesa
          cat > /tmp/routed_dialogue.py <<'PY'
          import json, urllib.request, urllib.error, pathlib, datetime, time

          ENDPOINT="https://api.llm7.io/v1/chat/completions"
          HEADERS={
              "Content-Type":"application/json",
              "Accept":"application/json",
              "User-Agent":"THOTH-MESA-LAB/0.7",
          }

          def call(selector,prompt):
              payload={
                  "model":selector,
                  "messages":[{"role":"user","content":prompt}],
                  "temperature":0.15,
                  "max_tokens":320,
                  "stream":False,
              }
              req=urllib.request.Request(
                  ENDPOINT,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=HEADERS,
                  method="POST",
              )
              start=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=100) as resp:
                      raw=resp.read().decode("utf-8","replace")
                      obj=json.loads(raw)
                      content=obj["choices"][0]["message"]["content"]
                      if isinstance(content,list):
                          content="\n".join(str(x.get("text",x)) if isinstance(x,dict) else str(x) for x in content)
                      return {
                          "ok":True,
                          "selector":selector,
                          "response_model":obj.get("model"),
                          "http_status":resp.status,
                          "latency_s":round(time.time()-start,3),
                          "text":str(content).strip(),
                          "usage":obj.get("usage"),
                      }
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  return {"ok":False,"selector":selector,"http_status":e.code,"latency_s":round(time.time()-start,3),"error":raw[:2500]}
              except Exception as e:
                  return {"ok":False,"selector":selector,"http_status":0,"latency_s":round(time.time()-start,3),"error":repr(e)}

          def log_attempt(phase,r,attempts):
              compact={k:v for k,v in r.items() if k not in ("text","usage")}
              attempts.append({"phase":phase,**compact})
              print(json.dumps({"phase":phase,"attempt":compact},ensure_ascii=False),flush=True)

          attempts=[]
          prompt_a="""ID THOTH-EXT-A-07. Você é IA-A numa conversa técnica entre IAs.
          Estamos projetando uma sala externa persistente para várias IAs colaborarem. THOTH WEB deve ser apenas ferramenta auxiliar, nunca caminho crítico. A VPS atual não deve carregar inferência pesada nem o histórico principal.
          Requisitos: memória com proveniência, tarefas com estados explícitos, auditoria, retomada sem duplicação, limites de custo/rate, visibilidade humana e nenhuma escrita direta em produção.
          Fase atual: arquitetura da sala apenas. Não altere o THOTH.
          Proponha a MENOR arquitetura viável e a falha mais importante a testar primeiro.
          Responda em português, até 160 palavras, começando exatamente com ACK THOTH-EXT-A-07."""

          a=None
          for selector in ["default","fast","default"]:
              r=call(selector,prompt_a); log_attempt("A",r,attempts)
              if r.get("ok") and r.get("text") and r.get("response_model"):
                  a=r; break
              time.sleep(2)
          if not a:
              pathlib.Path("lab/thoth-mesa/routed-failure.json").write_text(json.dumps(attempts,ensure_ascii=False,indent=2),encoding="utf-8")
              raise SystemExit("IA-A routed call failed")

          prompt_b=f"""ID THOTH-EXT-B-07. Você é IA-B, outra IA revisora. A IA-A acabou de responder:

          --- RESPOSTA EXATA DA IA-A ({a['response_model']}) ---
          {a['text']}
          --- FIM DA IA-A ---

          Responda DIRETAMENTE ao que ela propôs. Diga 1 ponto que manteria, 1 que mudaria e proponha UM teste falsificável de retomada após queda do coordenador sem duplicar tarefas. THOTH WEB deve permanecer fora do caminho crítico. Não altere THOTH.
          Responda em português, até 160 palavras, começando exatamente com ACK THOTH-EXT-B-07."""

          b=None
          for selector in ["fast","default","fast","default","fast"]:
              time.sleep(2)
              r=call(selector,prompt_b); log_attempt("B",r,attempts)
              if not (r.get("ok") and r.get("text") and r.get("response_model")):
                  continue
              if r["response_model"] == a["response_model"]:
                  print("B returned same underlying model; retrying for model diversity.",flush=True)
                  continue
              b=r; break
          if not b:
              pathlib.Path("lab/thoth-mesa/routed-failure.json").write_text(json.dumps(attempts,ensure_ascii=False,indent=2),encoding="utf-8")
              raise SystemExit("Could not obtain IA-B from a distinct response_model")

          prompt_c=f"""ID THOTH-EXT-C-07. Você é IA-C, terceira revisora.

          IA-A ({a['response_model']}):
          --- A ---
          {a['text']}
          --- FIM A ---

          IA-B ({b['response_model']}):
          --- B ---
          {b['text']}
          --- FIM B ---

          Sintetize o diálogo: 1 consenso, 1 discordância útil e UMA decisão mínima para a próxima etapa da sala. Não altere THOTH.
          Responda em português, até 140 palavras, começando exatamente com ACK THOTH-EXT-C-07."""

          c=None
          for selector in ["default","fast","default"]:
              time.sleep(2)
              r=call(selector,prompt_c); log_attempt("C",r,attempts)
              if not (r.get("ok") and r.get("text") and r.get("response_model")):
                  continue
              if r["response_model"] in {a["response_model"],b["response_model"]}:
                  continue
              c=r; break

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          checks={
              "b_received_a_verbatim":a["text"] in prompt_b,
              "a_b_response_models_distinct":a["response_model"]!=b["response_model"],
              "c_received_a_and_b_verbatim":bool(c) and a["text"] in prompt_c and b["text"] in prompt_c,
              "three_response_models_distinct":bool(c) and len({a["response_model"],b["response_model"],c["response_model"]})==3,
              "ack_a":a["text"].startswith("ACK THOTH-EXT-A-07"),
              "ack_b":b["text"].startswith("ACK THOTH-EXT-B-07"),
              "ack_c":bool(c) and c["text"].startswith("ACK THOTH-EXT-C-07"),
              "minimum_external_dialogue_proven": bool(a["text"] and b["text"] and a["text"] in prompt_b and a["response_model"]!=b["response_model"]),
          }
          transcript={
              "experiment_id":"THOTH-NEW-POINT-007",
              "timestamp_utc":now,
              "transport":"GitHub Actions hosted runner -> LLM7 anonymous dynamic router",
              "endpoint":"api.llm7.io",
              "thoth_web_dependency":False,
              "vps_dependency":False,
              "phase":"communication-only",
              "ia_a":a,
              "ia_b":b,
              "ia_c":c,
              "checks":checks,
              "attempts":attempts,
          }
          pathlib.Path("lab/thoth-mesa/transcript-routed-007.json").write_text(
              json.dumps(transcript,ensure_ascii=False,indent=2),encoding="utf-8"
          )

          cblock=""
          if c:
              cblock=f"""
          ## IA-C
          - Router selector: `{c['selector']}`
          - Actual response model: `{c['response_model']}`
          - HTTP {c['http_status']} · {c['latency_s']} s

          {c['text']}
          """

          md=f"""# THOTH Multi-AI External Dialogue — Proof 007

          **UTC:** {now}
          **Transport:** GitHub Actions hosted runner → anonymous dynamic LLM router
          **THOTH WEB dependency:** NO
          **VPS dependency:** NO
          **THOTH code touched:** NO

          ## IA-A
          - Router selector: `{a['selector']}`
          - Actual response model: `{a['response_model']}`
          - HTTP {a['http_status']} · {a['latency_s']} s

          {a['text']}

          ## IA-B
          - Router selector: `{b['selector']}`
          - Actual response model: `{b['response_model']}`
          - HTTP {b['http_status']} · {b['latency_s']} s

          {b['text']}
          {cblock}

          ## Falsifiable checks
          - B received A verbatim: **{checks['b_received_a_verbatim']}**
          - A/B actual response models distinct: **{checks['a_b_response_models_distinct']}**
          - C received A+B verbatim: **{checks['c_received_a_and_b_verbatim']}**
          - Three actual models distinct: **{checks['three_response_models_distinct']}**
          - A ACK: **{checks['ack_a']}**
          - B ACK: **{checks['ack_b']}**
          - C ACK: **{checks['ack_c']}**
          - Minimum external dialogue proven: **{checks['minimum_external_dialogue_proven']}**
          """
          pathlib.Path("lab/thoth-mesa/PROOF-007.md").write_text(md,encoding="utf-8")
          print("\nFINAL_PROOF\n"+json.dumps(transcript,ensure_ascii=False,indent=2),flush=True)
          PY
          python /tmp/routed_dialogue.py

      - name: Persist proof on isolated lab branch
        shell: bash
        run: |
          git config user.name "THOTH Mesa Lab"
          git config user.email "thoth-mesa-lab@users.noreply.github.com"
          git add lab/thoth-mesa/
          git commit -m "lab: persist anonymous routed multi-model dialogue proof"
          git push origin HEAD:lab/thoth-mesa-keyless-direct
