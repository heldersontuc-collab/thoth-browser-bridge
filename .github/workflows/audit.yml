name: bridge-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile
        run: python -m compileall -q bridge.py bridge_crypto.py bridge_mcp_client.py tests
      - name: Unit tests
        env:
          PYTHONPATH: .
          THOTH_API_KEY: audit-test-key
          BRIDGE_DATA_DIR: /tmp/thoth-bridge-audit
        run: python -m pytest -q
      - name: Compose config
        env:
          THOTH_API_KEY: audit-test-key
        run: docker compose config >/dev/null
