name: bridge-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile
        run: python -m compileall -q bridge.py bridge_crypto.py bridge_mcp_client.py tests node_v1_2_2/upgrade_v1_2_2.py
      - name: Unit tests
        env:
          PYTHONPATH: .
          THOTH_API_KEY: audit-test-key
          BRIDGE_DATA_DIR: /tmp/thoth-bridge-audit
        run: python -m pytest -q
      - name: Compose config
        env:
          THOTH_API_KEY: audit-test-key
        run: docker compose config >/dev/null
      - name: Bootstrap project isolation
        run: |
          grep -q 'COMPOSE_PROJECT_NAME=thoth-browser-bridge' bootstrap.sh
          ! grep -q -- '--env-file "$NODE_DIR/.env"' bootstrap.sh
          grep -q 'thoth-browser-node_control_api' bootstrap.sh

  patch-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Browser Node patch
        run: |
          cat node_v1_2_2/patch.part01 node_v1_2_2/patch.part02 node_v1_2_2/patch.part03 node_v1_2_2/patch.part04 node_v1_2_2/patch.part05 > /tmp/node.patch
          echo "0aac3b284d06df9e80212b03c664ddfb0655478bf8d0d849b1e9dc74512523dd  /tmp/node.patch" | sha256sum -c -
      - name: Bash syntax
        run: |
          bash -n deploy_audited_stack.sh
          bash -n audit_vps.sh
          bash -n prepare_control_network.sh
          bash -n deploy_bridge_core.sh
          bash -n publish_bridge_funnel.sh
