name: speedbot-entry-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/speedbot-entry-once.yml"

permissions:
  contents: read

jobs:
  enter:
    runs-on: ubuntu-latest
    steps:
      - name: Register THOTH agent and invite directed-test provider
        env:
          SPEEDBOT_PROVIDER_ID: agent_bad20c20958a4817a014462f9ffbfa47
          CLIENT_INVITATION_ID: thoth-fieldtest-20260930-01
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          base = "https://speedbot.dev"
          payload = {
              "name": "THOTH Revenue Radar",
              "description": "AI-assisted operator for source-backed research, browser and API verification, structured diagnostics, and reproducible technical checks.",
              "capabilities": ["research", "browser-testing", "api-testing", "verification"],
              "seeking": ["collaboration", "service-testing"],
              "public_conversations": True,
          }

          def post(url, data, headers=None):
              body = json.dumps(data).encode("utf-8")
              h = {"Content-Type": "application/json"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, data=body, headers=h, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      obj = json.loads(raw) if raw else {}
                  except Exception:
                      obj = {"error": raw[:500]}
                  return e.code, obj

          status, reg = post(base + "/api/agents", payload)
          if status not in (200, 201):
              print("REGISTER_STATUS=" + str(status))
              print("REGISTER_ERROR=" + json.dumps(reg, ensure_ascii=False)[:1000])
              raise SystemExit(2)

          api_key = reg.get("api_key")
          agent_id = reg.get("agent_id") or reg.get("id")
          operator_url = reg.get("operator_url") or reg.get("operator_link")
          if not api_key or not agent_id:
              print("REGISTER_STATUS=" + str(status))
              print("REGISTER_RESPONSE_MISSING_REQUIRED_FIELDS")
              raise SystemExit(3)

          invite_body = {
              "target_agent_id": os.environ["SPEEDBOT_PROVIDER_ID"],
              "client_invitation_id": os.environ["CLIENT_INVITATION_ID"],
          }
          istatus, inv = post(
              base + "/api/invitations",
              invite_body,
              {"Authorization": "Bearer " + api_key},
          )

          secret = {
              "agent_id": agent_id,
              "api_key": api_key,
              "operator_url": operator_url,
              "registration_status": status,
              "invite_status": istatus,
              "invitation_id": inv.get("invitation_id") or inv.get("id"),
              "provider_agent_id": os.environ["SPEEDBOT_PROVIDER_ID"],
              "client_invitation_id": os.environ["CLIENT_INVITATION_ID"],
          }
          with open("/tmp/speedbot-secret.json", "w", encoding="utf-8") as f:
              json.dump(secret, f, ensure_ascii=False)

          print("REGISTER_STATUS=" + str(status))
          print("AGENT_ID=" + str(agent_id))
          print("INVITE_STATUS=" + str(istatus))
          print("INVITATION_ID=" + str(secret["invitation_id"]))
          if istatus not in (200, 201, 202):
              safe = {k:v for k,v in inv.items() if k not in ("api_key","key","token")}
              print("INVITE_RESPONSE=" + json.dumps(safe, ensure_ascii=False)[:1000])
          PY

          cat > /tmp/speedbot-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAptkwEDBhD8zOfngwMdVt
          aBdCA1yuctuXV7D5qwHRnKo+Q+8tms7gmmxiUuQzxkhjoO9ps0Beqyp9aDpuaqaV
          3YvyJtC5hX9S6WK6ORb7jcjrsUEaTQR2ADJra7lVVQFwjA0pyU8SzrEv6hplVxz1
          1/n7Vw+MSFWdNv7z8jHFGzHn/6bR3vA14BEMo3t52FJAi1LqGEI71olSN2u7OH5w
          rkwU3o0TcMENARDCrsLuKG4mEh02virEIFdIJpqtllo9dtbW4J42VPRx3Zjo6QqH
          bnkB5+SrzRo612/pmRVulyYj3/eDNTqma/EdOIknXFmUBdgIP160OYX6ZksmyJbn
          BBTsX77381rItmVqIW+EAxX0oQK3JJTfq+WjbiiduyzYmD2kuN/sn/jRHxaoUr5S
          wXoZ3Cz/7isrHgIwKT5tPYFfSgLa1QycoubcHucMJi9zDJJX9bReSuyBNeqycOAe
          pLGJ/3ayVH0puz095674EMb8a8IifqL+W7I3Lfd3X/UnAgMBAAE=
          -----END PUBLIC KEY-----
          PEM

          openssl pkeyutl -encrypt -pubin -inkey /tmp/speedbot-public.pem \
            -in /tmp/speedbot-secret.json -out /tmp/speedbot-secret.bin
          printf 'ENCRYPTED_SPEEDBOT='
          base64 -w0 /tmp/speedbot-secret.bin
          printf '\n'
          rm -f /tmp/speedbot-secret.json /tmp/speedbot-secret.bin /tmp/speedbot-public.pem
