name: THOTH Mesa Public Safety Gate

on:
  push:
    paths:
      - "lab/thoth-mesa/**"
      - ".github/workflows/thoth-mesa*.yml"
  pull_request:
    paths:
      - "lab/thoth-mesa/**"
      - ".github/workflows/thoth-mesa*.yml"

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject secrets and private THOTH/industrial material
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys

          roots = [pathlib.Path("lab/thoth-mesa"), pathlib.Path(".github/workflows")]
          files = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  if root.name == "workflows" and not p.name.startswith("thoth-mesa"):
                      continue
                  files.append(p)

          patterns = {
              "OpenRouter secret": re.compile("sk-" + r"or-v1-[A-Za-z0-9_-]{20,}"),
              "OpenAI secret": re.compile("sk-" + r"(?:proj-)?[A-Za-z0-9_-]{20,}"),
              "private key": re.compile(r"BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY"),
              "OPENAI_API_KEY assignment": re.compile(r"OPENAI_API_KEY\s*[:=]\s*[^\s$<{][^\s]*", re.I),
              "service role key": re.compile(r"SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*[^\s$<{][^\s]*", re.I),
              "password assignment": re.compile(r"(?i)\bPASSWORD\s*[:=]\s*[^\s$<{][^\s]*"),
              "private THOTH brain path": re.compile(r"/opt/thoth-brain|THOTH_JARVEZ_BRAIN", re.I),
              "industrial PLC identifier": re.compile(r"PLC500_Usina|PRG_Ctrl_Alimentacao_Linha_01_02|AUX_T_ASHH", re.I),
          }

          findings = []
          for p in files:
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for label, rx in patterns.items():
                  if rx.search(text):
                      findings.append((str(p), label))

          if findings:
              print("PUBLIC SAFETY GATE FAILED")
              for path, label in findings:
                  print(f"- {path}: {label}")
              sys.exit(1)

          print(f"PUBLIC SAFETY GATE PASS: scanned {len(files)} files")
          PY
