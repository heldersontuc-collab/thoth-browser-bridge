name: THOTH Mesa External Dialogue

on:
  push:
    branches:
      - lab/thoth-mesa-llmfaucet

permissions:
  contents: write

jobs:
  dialogue:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/thoth-mesa-llmfaucet

      - name: Run real multi-model dialogue on AI Horde
        shell: bash
        run: |
          mkdir -p lab/thoth-mesa
          cat > /tmp/dialogue.py <<'PY'
          import json, urllib.request, urllib.error, datetime, pathlib, time

          BASE = "https://aihorde.net/api/v2"
          COMMON = {
              "Client-Agent": "THOTH-MESA-LAB:0.2:github-actions",
              "Accept": "application/json",
              "User-Agent": "THOTH-MESA-LAB/0.2",
          }
          ANON_KEY = "0000000000"

          def http_json(url, method="GET", payload=None, timeout=60, extra_headers=None):
              headers = dict(COMMON)
              if extra_headers:
                  headers.update(extra_headers)
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read().decode("utf-8", "replace")
                      return {"ok": True, "status": resp.status, "json": json.loads(raw), "headers": dict(resp.headers.items())}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try: body = json.loads(raw)
                  except Exception: body = {"raw": raw}
                  return {"ok": False, "status": e.code, "json": body, "headers": dict(e.headers.items())}
              except Exception as e:
                  return {"ok": False, "status": 0, "json": {"error": repr(e)}, "headers": {}}

          def active_models():
              r = http_json(BASE + "/status/models?type=text")
              if not r["ok"]:
                  raise RuntimeError("model status failed: " + json.dumps(r, ensure_ascii=False))
              rows = r["json"] if isinstance(r["json"], list) else r["json"].get("models", [])
              cleaned = []
              for x in rows:
                  name = x.get("name") or x.get("model")
                  count = x.get("count", 0) or 0
                  queued = x.get("queued", 0) or 0
                  jobs = x.get("jobs", 0) or 0
                  performance = x.get("performance", 0) or 0
                  if name and count > 0:
                      cleaned.append({"name": str(name), "count": count, "queued": queued, "jobs": jobs, "performance": performance})
              cleaned.sort(key=lambda x: (-x["count"], x["queued"], -x["performance"]))
              return cleaned

          def generate(model, prompt, max_length=360):
              submit = http_json(
                  BASE + "/generate/async",
                  "POST",
                  {
                      "prompt": prompt,
                      "models": [model],
                      "params": {
                          "n": 1,
                          "max_length": max_length,
                          "max_context_length": 4096,
                          "temperature": 0.25,
                          "top_p": 0.9,
                      },
                      "slow_workers": True,
                  },
                  extra_headers={"apikey": ANON_KEY},
              )
              if not submit["ok"] or not submit["json"].get("id"):
                  return None, {"submit": submit}
              job_id = submit["json"]["id"]
              trace = {"job_id": job_id, "submit": {"status": submit["status"]}}
              for i in range(150):
                  time.sleep(2)
                  status = http_json(BASE + f"/generate/status/{job_id}", extra_headers={"apikey": ANON_KEY})
                  if not status["ok"]:
                      trace["last_status"] = status
                      continue
                  data = status["json"]
                  if data.get("faulted"):
                      trace["last_status"] = data
                      return None, trace
                  if data.get("done"):
                      gens = data.get("generations") or []
                      if not gens:
                          trace["last_status"] = data
                          return None, trace
                      g = gens[0]
                      result = {
                          "requested_model": model,
                          "actual_model": g.get("model") or model,
                          "worker_id": g.get("worker_id"),
                          "worker_name": g.get("worker_name"),
                          "text": (g.get("text") or "").strip(),
                          "job_id": job_id,
                          "seed": g.get("seed"),
                          "state": g.get("state"),
                      }
                      trace["polls"] = i + 1
                      return result, trace
              trace["error"] = "timeout"
              return None, trace

          models = active_models()
          pathlib.Path("lab/thoth-mesa/aihorde-models-snapshot.json").write_text(
              json.dumps(models, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          if len(models) < 2:
              raise SystemExit("Need at least 2 active text models; got " + str(len(models)))

          prompt_a = """ID THOTH-EXT-A-02. Você é IA-A em um diálogo de engenharia entre modelos diferentes.
          Estamos projetando uma sala externa e persistente para várias IAs colaborarem. THOTH WEB NÃO pode ser dependência do canal; deve ser apenas ferramenta auxiliar de acesso. Armazenamento pesado e inferência devem ficar fora da VPS atual.
          Requisitos: proveniência persistente, estado explícito de tarefas, auditoria, retomada segura, limites de custo/rate, visibilidade humana e nenhum agente escrevendo em produção.
          Fase atual: discutir a arquitetura da sala, sem alterar o THOTH.
          Proponha a MENOR arquitetura viável e identifique a falha mais importante a testar primeiro.
          Responda em português, até 180 palavras, começando exatamente com ACK THOTH-EXT-A-02."""

          attempts = []
          a = None
          for entry in models[:12]:
              res, trace = generate(entry["name"], prompt_a)
              attempts.append({"phase":"A","model":entry["name"],"success":bool(res),"trace":trace})
              if res and res.get("text"):
                  a = res
                  break
          if not a:
              pathlib.Path("lab/thoth-mesa/failed-attempts.json").write_text(json.dumps(attempts, ensure_ascii=False, indent=2), encoding="utf-8")
              raise SystemExit("IA-A failed across active models")

          prompt_b = f"""ID THOTH-EXT-B-02. Você é IA-B, um revisor independente em um diálogo REAL entre dois modelos.
          A IA-A respondeu:

          --- MENSAGEM EXATA DA IA-A ---
          {a['text']}
          --- FIM DA MENSAGEM DA IA-A ---

          Responda DIRETAMENTE à proposta da IA-A. Diga 1 ponto que manteria, 1 ponto que mudaria e proponha um teste falsificável para provar retomada após queda do coordenador sem duplicar tarefas.
          THOTH WEB deve permanecer fora do caminho crítico. Não altere o THOTH nesta fase.
          Responda em português, até 180 palavras, começando exatamente com ACK THOTH-EXT-B-02."""

          b = None
          for entry in models[:18]:
              if entry["name"] == a["actual_model"] or entry["name"] == a["requested_model"]:
                  continue
              res, trace = generate(entry["name"], prompt_b)
              attempts.append({"phase":"B","model":entry["name"],"success":bool(res),"trace":trace})
              if res and res.get("text"):
                  # Require actual model name to differ when Horde reports it.
                  if res.get("actual_model") == a.get("actual_model"):
                      continue
                  b = res
                  break
          if not b:
              pathlib.Path("lab/thoth-mesa/failed-attempts.json").write_text(json.dumps(attempts, ensure_ascii=False, indent=2), encoding="utf-8")
              raise SystemExit("IA-B failed across alternate active models")

          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          transcript = {
              "experiment_id": "THOTH-NEW-POINT-002",
              "timestamp_utc": now,
              "transport": "GitHub Actions runner -> AI Horde public distributed inference API",
              "thoth_web_dependency": False,
              "vps_dependency": False,
              "phase": "communication-only",
              "ia_a": a,
              "ia_b": b,
              "b_received_a_verbatim": a["text"] in prompt_b,
              "different_actual_models": a.get("actual_model") != b.get("actual_model"),
              "different_workers": bool(a.get("worker_id") and b.get("worker_id") and a.get("worker_id") != b.get("worker_id")),
              "ack_a": a["text"].startswith("ACK THOTH-EXT-A-02"),
              "ack_b": b["text"].startswith("ACK THOTH-EXT-B-02"),
              "attempts": attempts,
          }

          pathlib.Path("lab/thoth-mesa/transcript.json").write_text(
              json.dumps(transcript, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          md = f"""# THOTH Multi-AI External Dialogue — Proof 002

          **Timestamp UTC:** {now}
          **Transport:** GitHub Actions runner → AI Horde distributed public inference
          **THOTH WEB in critical path:** NO
          **Current VPS in critical path:** NO
          **Phase:** Communication only. THOTH application code was not modified.

          ## IA-A
          - Requested model: `{a['requested_model']}`
          - Actual model: `{a.get('actual_model')}`
          - Worker: `{a.get('worker_name')}`
          - Horde job: `{a.get('job_id')}`

          {a['text']}

          ## IA-B
          - Requested model: `{b['requested_model']}`
          - Actual model: `{b.get('actual_model')}`
          - Worker: `{b.get('worker_name')}`
          - Horde job: `{b.get('job_id')}`

          {b['text']}

          ## Proof checks
          - IA-B received IA-A response verbatim: **{transcript['b_received_a_verbatim']}**
          - Different actual model names: **{transcript['different_actual_models']}**
          - Different Horde workers: **{transcript['different_workers']}**
          - IA-A ACK respected: **{transcript['ack_a']}**
          - IA-B ACK respected: **{transcript['ack_b']}**
          - Persistent machine-readable transcript: `transcript.json`
          - Active model snapshot: `aihorde-models-snapshot.json`
          """
          pathlib.Path("lab/thoth-mesa/PROOF-002.md").write_text(md, encoding="utf-8")
          print(json.dumps(transcript, ensure_ascii=False, indent=2))
          PY
          python /tmp/dialogue.py

      - name: Persist proof on isolated lab branch
        shell: bash
        run: |
          git config user.name "THOTH Mesa Lab"
          git config user.email "thoth-mesa-lab@users.noreply.github.com"
          git add lab/thoth-mesa/
          if git diff --cached --quiet; then
            echo "No new proof to commit."
          else
            git commit -m "lab: persist external AI-Horde dialogue proof"
            git push origin HEAD:lab/thoth-mesa-llmfaucet
          fi
